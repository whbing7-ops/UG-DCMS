name: UG-DCMS Windows Fast Gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/windows/**'
      - 'src/installer/**'
      - 'src/frontend/**'
      - 'ci/full-functional-smoke.py'
      - '.github/workflows/windows-fast-process-gate.yml'

jobs:
  windows-fast-gate:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Parse current installer PowerShell
        shell: powershell
        run: |
          foreach($file in @('src\windows\install-oneclick.ps1','src\windows\migrate-native.ps1','src\windows\start-native.ps1','src\installer\Build-Setup.ps1')){
            $tokens=$null
            $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count -gt 0){
              foreach($e in $errors){ Write-Host ($file + ': ' + $e.Message + ' at line ' + $e.Extent.StartLineNumber + ', column ' + $e.Extent.StartColumnNumber) }
              throw ('PowerShell parse failure: ' + $file)
            }
          }
      - name: Validate current frontend modules and installer contracts
        shell: powershell
        run: |
          Get-ChildItem src\frontend\js\*.js | ForEach-Object { Get-Content $_.FullName -Raw | node --input-type=module --check; if($LASTEXITCODE -ne 0){ throw "JavaScript ES module parse failure: $($_.Name)" } }
          python src\installer\verify_installer_source.py
          python -m py_compile ci\full-functional-smoke.py
