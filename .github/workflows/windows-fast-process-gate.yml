name: UG-DCMS Windows Fast Gate

# 触发条件: PR 不带 paths 过滤, 是为了让每个检查都**必然上报**。
# 带 paths 过滤时, 一个没碰到这些路径的 PR 不会触发本流程, 于是必需检查一条也不
# 上报 —— 分支保护会把该 PR 永久挂在"等待状态上报", 永远合不进去; 若不设为必需,
# 它又显示为"没有检查"而看上去可以合。两头都不对, 所以过滤直接去掉。
# 本仓库是公开仓库, Actions 分钟数免费, 多跑几分钟换"绿就是真绿"是值的。
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  windows-fast-gate:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Parse current installer PowerShell
        shell: powershell
        run: |
          foreach($file in @('src\windows\install-oneclick.ps1','src\windows\migrate-native.ps1','src\windows\start-native.ps1','src\installer\Build-Setup.ps1')){
            $tokens=$null
            $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count -gt 0){
              foreach($e in $errors){ Write-Host ($file + ': ' + $e.Message + ' at line ' + $e.Extent.StartLineNumber + ', column ' + $e.Extent.StartColumnNumber) }
              throw ('PowerShell parse failure: ' + $file)
            }
          }
      - name: Validate current frontend modules and installer contracts
        shell: powershell
        run: |
          Get-ChildItem src\frontend\js\*.js | ForEach-Object { Get-Content $_.FullName -Raw | node --input-type=module --check; if($LASTEXITCODE -ne 0){ throw "JavaScript ES module parse failure: $($_.Name)" } }
          python src\installer\verify_installer_source.py
          python -m py_compile ci\full-functional-smoke.py
      - name: Compile and exercise Windows notification assistant
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File src/desktop/Build-Notify.ps1
          if($LASTEXITCODE -ne 0){throw 'Notification assistant compilation failed'}
          python ci/test-notify-desktop.py src/desktop/output/UG-DCMS-Notify-rc2.41.exe
          if($LASTEXITCODE -ne 0){throw 'Notification assistant checks failed'}
