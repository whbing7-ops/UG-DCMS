name: UG-DCMS rc2.45 source integration and installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'ci/full-functional-smoke.py'
      - 'ci/test-backup-restore.py'
      - 'ci/test-approval-permissions.py'
      - 'ci/test-ima-demo.py'
      - 'ci/test-applicant-workflow.py'
      - 'ci/test-notifications.py'
      - 'ci/test-scale-demo.py'
      - 'ci/test-import-progress.py'
      - 'ci/test-notify-desktop.py'
      - 'ci/dcms_http.py'
      - 'ci/test-file-lifecycle.py'
      - 'ci/test-baseline-readiness.py'
      - 'ci/test-file-impact.py'
      - 'ci/test-part-package.py'
      - 'ci/test-approval-overdue.py'
      - 'ci/test-consumer-roles.py'
      - 'ci/test-signoff.py'
      - '.github/workflows/windows-installer-ci-v5.yml'

concurrency:
  group: ug-dcms-rc245
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dcms-ci-password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend
        run: |
          pip install -r src/backend/requirements.txt playwright==1.51.0
          python -m playwright install --with-deps chromium
      - name: Create database with production application-owner permissions
        env:
          PGPASSWORD: dcms-ci-password
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -c "CREATE ROLE dcms LOGIN PASSWORD 'dcms-ci-password' NOSUPERUSER NOCREATEDB;"
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE dcms OWNER dcms;"
      - name: Validate frontend modules
        run: |
          for f in src/frontend/js/*.js; do node --input-type=module --check < "$f"; done
          python src/installer/verify_installer_source.py
      - name: Apply all migrations
        env:
          PGPASSWORD: dcms-ci-password
        run: |
          exec > >(tee /tmp/ug-dcms-migrations.log) 2>&1
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U dcms -d dcms -c "CREATE TABLE schema_migration (version text PRIMARY KEY, filename text NOT NULL, sha256 text NOT NULL, applied_at timestamptz NOT NULL DEFAULT now(), applied_by text NOT NULL DEFAULT current_user, duration_ms integer)"
          for f in src/db/migrations/*.sql; do
            psql -X -1 -v ON_ERROR_STOP=1 -h 127.0.0.1 -U dcms -d dcms -f "$f"
            v="$(basename "$f" .sql)"
            sha="$(sha256sum "$f" | cut -d' ' -f1)"
            psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U dcms -d dcms -c "INSERT INTO schema_migration(version,filename,sha256) VALUES ('$v','$(basename "$f")','$sha')"
          done
          test "$(psql -XAt -h 127.0.0.1 -U dcms -d dcms -c 'select count(*) from schema_migration')" = 27
          # Model the field failure: 0014 objects exist while its ledger row was
          # not recorded. Reapplying must reconcile without deleting any data.
          psql -X -1 -v ON_ERROR_STOP=1 -h 127.0.0.1 -U dcms -d dcms -f src/db/migrations/0014_operational_workflow.sql
          test "$(psql -XAt -h 127.0.0.1 -U dcms -d dcms -c 'select count(*) from external_part_class')" = 34
      - name: Verify real backup restore and failure diagnostics
        env:
          PYTHONPATH: src/backend
          DCMS_PG_HOST: 127.0.0.1
          DCMS_PG_USER: dcms
          DCMS_PG_PASSWORD: dcms-ci-password
          DCMS_PG_DATABASE: dcms
          DCMS_STORAGE_ROOT: ${{ runner.temp }}/restore-test-files
          DCMS_BACKUP_ROOT: ${{ runner.temp }}/restore-test-backups
        run: |
          python ci/test-backup-restore.py
          python ci/test-approval-permissions.py
          python ci/test-backup-restore.py --postgres
      - name: Start application and run role-separated functional smoke
        env:
          DCMS_PG_HOST: 127.0.0.1
          DCMS_PG_USER: dcms
          DCMS_PG_PASSWORD: dcms-ci-password
          DCMS_PG_DATABASE: dcms
          DCMS_STORAGE_ROOT: ${{ runner.temp }}/dcms-files
          DCMS_BACKUP_ROOT: ${{ runner.temp }}/dcms-backups
          DCMS_FRONTEND_ROOT: ${{ github.workspace }}/src/frontend
          DCMS_BCRYPT_ROUNDS: 4
          PGOPTIONS: "-c statement_timeout=120000 -c lock_timeout=30000"
          PYTHONPATH: src/backend
        run: |
          python -m uvicorn app.main:app --app-dir src/backend --host 127.0.0.1 --port 8080 > /tmp/ug-dcms.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8080/api/v1/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/v1/health
          python ci/full-functional-smoke.py /tmp/ima-credentials.json
          PYTHONPATH=src/backend python ci/test-ima-demo.py /tmp/ima-credentials.json
          PYTHONPATH=src/backend python ci/test-applicant-workflow.py /tmp/ima-credentials.json
          PYTHONPATH=src/backend python ci/test-notifications.py /tmp/ima-credentials.json
          PYTHONPATH=src/backend python ci/test-import-progress.py /tmp/ima-credentials.json
          PYTHONPATH=src/backend python -u ci/test-scale-demo.py /tmp/ima-credentials.json
          # rc2.45: 文档管理、基线检查、影响分析、件号资料包、审批超期、生产/采购角色、三级签署
          export DCMS_BASE_URL=http://127.0.0.1:8080
          for t in test-file-lifecycle test-baseline-readiness test-file-impact test-part-package test-approval-overdue test-consumer-roles test-signoff; do
            echo "== $t"
            PYTHONPATH=src/backend python ci/$t.py /tmp/ima-credentials.json
          done
      - name: Upload IMA browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ima-evidence-rc245
          path: |
            ima-evidence/
            applicant-evidence/
            notification-evidence/
            scale-evidence/
      - name: Upload application log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-log
          path: /tmp/ug-dcms.log
      - name: Upload migration log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: migration-log
          path: /tmp/ug-dcms-migrations.log

  installer:
    needs: integration
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          'C:\Program Files (x86)\Inno Setup 6' | Out-File $env:GITHUB_PATH -Append
      - name: Verify Windows restore diagnostics and attachment rollback
        run: |
          pip install -r src/backend/requirements.txt
          python ci/test-backup-restore.py
          python ci/test-approval-permissions.py
      - name: Verify and build canonical source
        shell: powershell
        run: |
          python src\installer\verify_installer_source.py
          powershell -NoProfile -ExecutionPolicy Bypass -File src\installer\Build-Setup.ps1
          $setup='src\installer\output\UG-DCMS-Setup-1.0.0-rc2.45.exe'
          if(-not(Test-Path $setup)){ throw 'installer missing' }
          if((Get-Item $setup).Length -lt 1000000){ throw 'installer unexpectedly small' }
          Get-FileHash $setup -Algorithm SHA256
      - name: Test compiled Windows notification assistant
        shell: powershell
        run: |
          python ci/test-notify-desktop.py src/desktop/output/UG-DCMS-Notify-rc2.41.exe
          if($LASTEXITCODE -ne 0){throw 'Desktop notification checks failed'}
      - name: Package installer and source
        shell: powershell
        run: |
          Compress-Archive -Path src\installer\output\UG-DCMS-Setup-1.0.0-rc2.45.exe -DestinationPath svgUG-DCMS-20260920-rc2.45.zip
      - uses: actions/upload-artifact@v4
        with:
          name: svgUG-DCMS-20260920-rc2.45
          path: |
            src/installer/output/UG-DCMS-Setup-1.0.0-rc2.45.exe
            src/desktop/output/UG-DCMS-Notify-rc2.41.exe
            notify-self-test.txt
            svgUG-DCMS-20260920-rc2.45.zip
