name: Publish verified rc2.35 installer
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-rc235.yml'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: svgUG-DCMS-20260912-rc2.35
          run-id: 34728104078
          github-token: ${{ github.token }}
          path: verified
      - name: Verify exact tested installer and prepare download
        run: |
          python - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          source=Path('verified/svgUG-DCMS-20260912-rc2.35.zip')
          with zipfile.ZipFile(source) as z:
              assert z.testzip() is None
              assert z.namelist()==['UG-DCMS-Setup-1.0.0-rc2.35.exe'], z.namelist()
              exe=z.read(z.namelist()[0])
              assert exe[:2]==b'MZ'
              assert hashlib.sha256(exe).hexdigest()=='4ee2c976b12bf2b80a42ae086352f561cc91ad8f464d61199836b9d4814d1e26'
          Path('UG-DCMS-Setup-rc2.35.zip').write_bytes(source.read_bytes())
          Path('SHA256SUMS.txt').write_text(hashlib.sha256(source.read_bytes()).hexdigest()+'  UG-DCMS-Setup-rc2.35.zip\n')
          PY
      - name: Publish downloadable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release-notes.md <<'EOF'
          修复软件审批中心缺少批准入口，支持打开指定软件版本；BOM 模板改为中文 Excel；对象层级仅保留零件和组件；外部件分类仅保留 T1–T3。

          已通过真实数据库恢复、失败回滚、业务接口和双账户浏览器回归。保留此前的设计族审批、编号、外部件唯一性、批量导入导出及 BOM 搜索修复。

          安装包来自已通过验证的构建 34728104078，源代码版本 83d5d6c0772be71d809549abaae5523f920655dd。解压 ZIP 后运行 EXE。
          EOF
          gh release create rc2.35 UG-DCMS-Setup-rc2.35.zip SHA256SUMS.txt --target 83d5d6c0772be71d809549abaae5523f920655dd --title 'UG-DCMS rc2.35' --prerelease --notes-file release-notes.md
