name: UG-DCMS Live UI Regression
# 触发条件: PR 不带 paths 过滤, 是为了让每个检查都**必然上报**。
# 带 paths 过滤时, 一个没碰到这些路径的 PR 不会触发本流程, 于是必需检查一条也不
# 上报 —— 分支保护会把该 PR 永久挂在"等待状态上报", 永远合不进去; 若不设为必需,
# 它又显示为"没有检查"而看上去可以合。两头都不对, 所以过滤直接去掉。
# 本仓库是公开仓库, Actions 分钟数免费, 多跑几分钟换"绿就是真绿"是值的。
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  live-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dcms
          POSTGRES_PASSWORD: ci-only-pg
          POSTGRES_DB: dcms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DCMS_PG_HOST: 127.0.0.1
      DCMS_PG_PORT: '5432'
      DCMS_PG_USER: dcms
      DCMS_PG_PASSWORD: ci-only-pg
      DCMS_PG_DATABASE: dcms
      DCMS_FRONTEND_ROOT: ${{ github.workspace }}/src/frontend
      DCMS_STORAGE_ROOT: ${{ github.workspace }}/ui-evidence/uploads
      DCMS_BACKUP_ROOT: ${{ github.workspace }}/ui-evidence/backups
      DCMS_BROWSER_PATH: /usr/bin/google-chrome
      PGPASSWORD: ci-only-pg
      DCMS_BCRYPT_ROUNDS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the same application sources used by the installer
        run: |
          for f in src/db/migrations/*.sql; do
            psql -h 127.0.0.1 -U dcms -d dcms -v ON_ERROR_STOP=1 -f "$f" > /dev/null
          done
          python -m pip install -q -r src/backend/requirements.txt playwright==1.51.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          google-chrome --version
      - name: Check browser interactions and state-specific rendering
        run: |
          npm install --no-save playwright@1.51.0
          node ci/test-ui-interactions.cjs
      - name: Start application and run actual UI operations
        run: |
          mkdir -p ui-evidence
          cd src/backend
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8080 > ../../ui-evidence/server.log 2>&1 &
          cd ../..
          python - <<'PY'
          import time,urllib.request
          for i in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health')
                  break
              except Exception: time.sleep(.5)
          else: raise RuntimeError('Application did not become healthy')
          PY
          python ci/full-functional-smoke.py "$RUNNER_TEMP/ui-credentials.json"
          python ci/test-installed-actions.py "$RUNNER_TEMP/ui-credentials.json" ui-evidence
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-regression-evidence
          path: ui-evidence/
