name: Publish verified rc2.43 installer
on:
  workflow_dispatch:
  push:
    branches: ['fix/restore-cross-version-rc2.33']
    paths: ['.github/workflows/publish-rc243.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify completed tests for exact source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for run in 35301802037 35301802031 35301802058; do
            gh api "repos/$GH_REPO/actions/runs/$run" > run.json
            python - <<'PY'
          import json
          r=json.load(open('run.json'))
          assert r['head_sha']=='7d0c58d1dbdf37f8c4d5ceadd185662e19c33c4b'
          assert r['status']=='completed' and r['conclusion']=='success'
          PY
          done
      - uses: actions/download-artifact@v4
        with:
          name: svgUG-DCMS-20260918-rc2.43
          run-id: 35301802037
          github-token: ${{ github.token }}
          path: verified
      - uses: actions/download-artifact@v4
        with:
          name: ima-evidence-rc243
          run-id: 35301802037
          github-token: ${{ github.token }}
          path: evidence
      - name: Validate and package installer
        run: |
          python - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          name='UG-DCMS-Setup-1.0.0-rc2.43.exe'
          source=Path('verified/svgUG-DCMS-20260918-rc2.43.zip')
          with zipfile.ZipFile(source) as z:
              assert z.testzip() is None
              assert z.namelist()==[name]
              exe=z.read(name)
              assert exe[:2]==b'MZ'
              assert hashlib.sha256(exe).hexdigest()=='70c285afd5e6c4d8c25641ae272772c0aab0049128e7fdfe5456e34539c99eec'
          Path(name).write_bytes(exe)
          Path('UG-DCMS-Setup-rc2.43.zip').write_bytes(source.read_bytes())
          package='UG-DCMS-10Projects-Data-Backup-v1.zip'
          import json
          result=json.loads(Path('evidence/scale-evidence/result.json').read_text())
          assert result['passed'] is True
          expected=dict(families=1000,parts=10000,software=500,externals=5000,projects=10,baselines=10000,documents=1010,bom_lines=15008,project_controls=5009,hardware_links=1010)
          assert result['counts']==expected
          assert result['approvals']==22519
          payload=Path('evidence/scale-evidence',package).read_bytes()
          assert hashlib.sha256(payload).hexdigest()==result['package_sha256']
          Path(package).write_bytes(payload)
          with zipfile.ZipFile(package) as z:
              assert z.testzip() is None
              m=json.loads(z.read('manifest.json'))
              assert m['format']=='UG-DCMS-DATA-BACKUP' and m['dataset_code']=='SIM-SCALE-V1'
              assert m['minimum_release']=='rc2.43'
              assert hashlib.sha256(z.read('dataset.json')).hexdigest()==m['payload_sha256']
              Path('IMPORT-README-zh-CN.txt').write_bytes(z.read('导入说明.txt'))
          assets=[name,'UG-DCMS-Setup-rc2.43.zip',package,'IMPORT-README-zh-CN.txt']
          Path('SHA256SUMS.txt').write_text(''.join(hashlib.sha256(Path(p).read_bytes()).hexdigest()+'  '+p+'\n' for p in assets))
          PY
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release-notes.md <<'EOF'
          rc2.43：十项目规模模拟业务数据包及增量导入支持。

          数据包：UG-DCMS-10Projects-Data-Backup-v1.zip。
          新增1000个设计族、10000个内部件号（每族10个Dash）、500个软件对象、5000个外部件号、10个模拟项目。
          每项目使用1000个内部件、500个外部件、50个软件，另有跨项目共用件、共用外部件和共用软件。
          包含15008条三层BOM、1010份模拟设计资料、500份软件元数据包、10000条发布设计基线、22519次模拟审批。
          10个项目通过构型上下文、项目设计基线、外部件项目准入与冻结目录体现，并在导入完成面板提供入口。

          导入步骤：
          1. 下载 UG-DCMS-Setup-rc2.43.zip，解压运行 EXE 升级。升级不会自动写入模拟数据。
          2. 管理员登录 → 系统 → 备份恢复 → 导入数据备份包。
          3. 选择 UG-DCMS-10Projects-Data-Backup-v1.zip，输入“导入模拟数据”，点击“校验并导入数据”。
          4. 数据量较大，请保持服务运行，等待完成；可重新打开备份页查看导入记录。

          这是增量逻辑数据包，不是整库灾备文件，请勿用于“恢复系统”整库替换入口。
          仅新增模拟记录，保留已有数据、账户和附件。固定可信载荷校验、事务回滚与附件清理、重复导入保护、前缀冲突和并发保护均经过测试。
          所有数据仅供模拟业务，软件包不含可运行固件；模拟审批由两个独立身份执行，完成后身份停用。
          原 IMA 数据包及 rc2.41 通知助手仍可使用。

          在独立 PostgreSQL 测试库实际导入并逐项核验上述数量、十个项目的完整BOM、发布基线、软件附件摘要及已有数据保持不变。浏览器导入入口、项目基线跳转和重复导入已验证；Windows EXE 构建通过。
          未连接或写入用户现用系统，未在用户电脑执行本次升级或导入。PR #2 保持未合并。

          测试源码：7d0c58d1dbdf37f8c4d5ceadd185662e19c33c4b
          数据导入及安装包：https://github.com/whbing7-ops/UG-DCMS/actions/runs/35301802037
          页面回归：https://github.com/whbing7-ops/UG-DCMS/actions/runs/35301802031
          EOF
          gh release create rc2.43 UG-DCMS-10Projects-Data-Backup-v1.zip IMPORT-README-zh-CN.txt UG-DCMS-Setup-rc2.43.zip UG-DCMS-Setup-1.0.0-rc2.43.exe SHA256SUMS.txt --target 7d0c58d1dbdf37f8c4d5ceadd185662e19c33c4b --title 'UG-DCMS rc2.43 — 十项目规模模拟数据包' --prerelease --notes-file release-notes.md
      - name: Verify anonymous public ZIP download
        run: |
          set -euo pipefail
          mkdir public-download
          cd public-download
          for name in UG-DCMS-Setup-rc2.43.zip UG-DCMS-10Projects-Data-Backup-v1.zip IMPORT-README-zh-CN.txt SHA256SUMS.txt; do
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors --max-time 180 \
              "https://github.com/${{ github.repository }}/releases/download/rc2.43/$name" --output "$name"
          done
          python - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('UG-DCMS-Setup-rc2.43.zip') as z:
              assert z.testzip() is None
              name='UG-DCMS-Setup-1.0.0-rc2.43.exe'
              assert z.namelist()==[name]
              Path(name).write_bytes(z.read(name))
          PY
          sha256sum --check SHA256SUMS.txt
