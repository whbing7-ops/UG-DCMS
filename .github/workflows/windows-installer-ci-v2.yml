name: UG-DCMS Windows Installer Validation v2

on:
  workflow_dispatch:
  push:
    paths:
      - 'ci/rc210_ci_payload.zip'
      - '.github/workflows/windows-installer-ci-v2.yml'

jobs:
  windows-install-smoke:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Verify and extract source
        shell: powershell
        run: |
          $zip='ci\rc210_ci_payload.zip'
          if(-not (Test-Path $zip)){ throw 'source ZIP missing' }
          $size=(Get-Item $zip).Length
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToUpperInvariant()
          if($size -ne 226595){ throw "ZIP size mismatch: $size" }
          if($hash -ne '23FCA65F85DF2F83D9020F9168D232111F9E7523F1209A15C73E5F372EE0E1F8'){ throw "ZIP SHA256 mismatch: $hash" }
          New-Item -ItemType Directory -Force src | Out-Null
          Expand-Archive $zip src -Force
          foreach($p in @('src\installer\Build-Setup.ps1','src\windows\install-oneclick.ps1','src\backend\app\main.py','src\db\migrations\0012_applicability_configuration.sql')){ if(-not(Test-Path $p)){ throw "missing $p" } }

      - name: Patch Windows installer reliability defects
        working-directory: src
        shell: powershell
        run: |
          $build='installer\Build-Setup.ps1'
          $t=Get-Content $build -Raw -Encoding UTF8
          $old='(Get-Content $MyInvocation.MyCommand.Path -Raw -Encoding UTF8)'
          $new='(Get-Content $PSCommandPath -Raw -Encoding UTF8)'
          if(-not $t.Contains($old)){ throw 'Build-Setup self-path expression not found' }
          $t=$t.Replace($old,$new)
          Set-Content $build $t -Encoding UTF8

          $provision='windows\install-oneclick.ps1'
          $p=Get-Content $provision -Raw -Encoding UTF8
          $oldTranscript='try { Start-Transcript -Path $LogFile -Append -Force | Out-Null } catch {}'
          $newTranscript='$TranscriptFile = Join-Path $LogDir ''powershell-transcript.log''`r`ntry { Start-Transcript -Path $TranscriptFile -Append -Force | Out-Null } catch {}'
          if(-not $p.Contains($oldTranscript)){ throw 'Transcript expression not found' }
          $p=$p.Replace($oldTranscript,$newTranscript)

          $oldExit='  if($proc.ExitCode -ne 0){ throw "$Step 失败，退出码 $($proc.ExitCode)" }'
          $newExit=@'
  $proc.Refresh()
  if(-not $proc.HasExited){ throw "$Step 结束状态异常：进程未退出。" }
  $exitCode = $proc.ExitCode
  if($exitCode -ne 0){ throw "$Step 失败，退出码 $exitCode" }
'@
          if(-not $p.Contains($oldExit)){ throw 'Process exit-code expression not found' }
          $p=$p.Replace($oldExit,$newExit.TrimEnd())
          Set-Content $provision $p -Encoding UTF8

          $check=Get-Content $provision -Raw -Encoding UTF8
          if($check.Contains('Start-Transcript -Path $LogFile')){ throw 'Transcript still locks install.log' }
          if(-not $check.Contains('$proc.Refresh()')){ throw 'Exit-code refresh patch missing' }
          Write-Host 'Provisioning reliability patches applied.'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install build prerequisites
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          $pw=[guid]::NewGuid().ToString('N')
          choco install postgresql16 -y --no-progress --params "/Password:$pw"
          $pg=Get-ChildItem 'C:\Program Files\PostgreSQL' -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
          if(-not $pg){ throw 'PostgreSQL not found' }
          "C:\Program Files (x86)\Inno Setup 6" | Out-File $env:GITHUB_PATH -Append
          "$($pg.FullName)\bin" | Out-File $env:GITHUB_PATH -Append

      - name: Static installer audit
        working-directory: src
        shell: powershell
        run: python installer\verify_installer_source.py

      - name: Build Setup.exe
        working-directory: src
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer\Build-Setup.ps1

      - name: Verify Setup.exe
        working-directory: src
        shell: powershell
        run: |
          $setup='installer\output\UG-DCMS-Setup-1.0.0-rc2.10.exe'
          if(-not(Test-Path $setup)){ throw 'Setup.exe missing' }
          if((Get-Item $setup).Length -lt 1000000){ throw 'Setup.exe too small' }
          Get-FileHash $setup -Algorithm SHA256 | Format-List
          Get-Item $setup | Format-List FullName,Length,LastWriteTime

      - name: Install UG-DCMS silently
        working-directory: src
        shell: powershell
        run: |
          $setup=(Resolve-Path 'installer\output\UG-DCMS-Setup-1.0.0-rc2.10.exe').Path
          $proc=Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/LOG=C:\ugdcms-inno.log') -PassThru -Wait
          if($proc.ExitCode -ne 0){ throw "Setup exit code $($proc.ExitCode)" }

      - name: Wait for provisioning completion
        shell: powershell
        run: |
          $status='C:\ProgramData\UG-DCMS\INSTALLATION-STATUS.txt'
          $err='C:\ProgramData\UG-DCMS\logs\LAST-ERROR.txt'
          $deadline=(Get-Date).AddMinutes(15)
          do {
            if(Test-Path $err){ Get-Content $err -Tail 150; Get-Content 'C:\ProgramData\UG-DCMS\logs\install.log' -Tail 300 -ErrorAction SilentlyContinue; throw 'Provisioning failed' }
            if(Test-Path $status){ Get-Content $status; break }
            Start-Sleep 5
          } while((Get-Date) -lt $deadline)
          if(-not(Test-Path $status)){ Get-Content 'C:\ProgramData\UG-DCMS\logs\install.log' -Tail 300 -ErrorAction SilentlyContinue; throw 'Provisioning timeout' }

      - name: Verify services and deployment pointers
        shell: powershell
        run: |
          $db=Get-Service UGDCMS-PostgreSQL -ErrorAction Stop
          $app=Get-Service UGDCMS-App -ErrorAction Stop
          if($db.Status -ne 'Running'){ throw "DB service $($db.Status)" }
          if($app.Status -ne 'Running'){ throw "App service $($app.Status)" }
          $runtime=(Get-Content 'C:\ProgramData\UG-DCMS\runtime\CURRENT-RUNTIME.txt' -Raw).Trim()
          $release=(Get-Content 'C:\ProgramData\UG-DCMS\releases\CURRENT-RELEASE.txt' -Raw).Trim()
          if(-not(Test-Path $runtime)){ throw "runtime pointer target missing: $runtime" }
          if(-not(Test-Path $release)){ throw "release pointer target missing: $release" }

      - name: HTTP health and UI smoke
        shell: powershell
        run: |
          $deadline=(Get-Date).AddSeconds(120)
          $ok=$false
          do { try { $r=Invoke-WebRequest 'http://127.0.0.1:8080/api/v1/system/health' -UseBasicParsing -TimeoutSec 5; if($r.StatusCode -eq 200){$ok=$true;break} } catch {}; Start-Sleep 2 } while((Get-Date) -lt $deadline)
          if(-not $ok){ throw 'Health endpoint not ready' }
          $ui=Invoke-WebRequest 'http://127.0.0.1:8080/' -UseBasicParsing -TimeoutSec 10
          if($ui.StatusCode -ne 200){ throw "UI HTTP $($ui.StatusCode)" }
          Write-Host 'UG-DCMS Windows installer smoke PASS'

      - name: Collect diagnostics
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force 'ci-artifacts\diagnostics' | Out-Null
          Copy-Item 'C:\ProgramData\UG-DCMS\logs\*' 'ci-artifacts\diagnostics' -Force -ErrorAction SilentlyContinue
          Copy-Item 'C:\ProgramData\UG-DCMS\INSTALLATION-STATUS.txt' 'ci-artifacts\diagnostics' -Force -ErrorAction SilentlyContinue
          Copy-Item 'C:\ugdcms-inno.log' 'ci-artifacts\diagnostics' -Force -ErrorAction SilentlyContinue
          Get-Service 'UGDCMS-*' -ErrorAction SilentlyContinue | Format-List * | Out-File 'ci-artifacts\diagnostics\services.txt'

      - name: Upload Setup.exe and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ug-dcms-windows-installer-validation-v2
          if-no-files-found: ignore
          path: |
            src/installer/output/*.exe
            ci-artifacts/diagnostics/**
