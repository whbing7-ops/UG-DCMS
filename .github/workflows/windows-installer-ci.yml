name: UG-DCMS Windows Installer Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'ci/rc210trim8/**'
      - '.github/workflows/windows-installer-ci.yml'

jobs:
  windows-install-smoke:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct UG-DCMS source archive
        shell: powershell
        run: |
          $files = @(
            (Get-ChildItem 'ci\rc210trim8\part*.b64' | Sort-Object Name)
            (Get-ChildItem 'ci\rc210trim8\tail*.b64' | Sort-Object Name)
          )
          if ($files.Count -lt 10) { throw "Chunk set incomplete: $($files.Count) files" }
          $sb = New-Object System.Text.StringBuilder
          foreach ($f in $files) { [void]$sb.Append((Get-Content $f.FullName -Raw).Trim()) }
          $b64 = $sb.ToString()
          Write-Host "Base64 chars: $($b64.Length)"
          [IO.File]::WriteAllBytes('rc210_ci_payload.zip', [Convert]::FromBase64String($b64))
          $hash = Get-FileHash 'rc210_ci_payload.zip' -Algorithm SHA256
          $hash | Format-List
          if ((Get-Item 'rc210_ci_payload.zip').Length -lt 100000) { throw 'Reconstructed archive is unexpectedly small.' }

      - name: Extract UG-DCMS source
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path src | Out-Null
          Expand-Archive -Path 'rc210_ci_payload.zip' -DestinationPath src -Force
          if (-not (Test-Path 'src\installer\Build-Setup.ps1')) { throw 'Installer source missing.' }
          if (-not (Test-Path 'src\backend\app\main.py')) { throw 'Backend source missing.' }
          if (-not (Test-Path 'src\db\migrations\0012_applicability_configuration.sql')) { throw 'Migration 0012 missing.' }

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install build prerequisites
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          $pgPassword = [guid]::NewGuid().ToString('N')
          choco install postgresql16 -y --no-progress --params "/Password:$pgPassword"
          $pg = Get-ChildItem 'C:\Program Files\PostgreSQL' -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $pg) { throw 'PostgreSQL installation not found' }
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Append
          "C:\Program Files\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Append
          "$($pg.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Static installer audit
        working-directory: src
        shell: powershell
        run: python installer\verify_installer_source.py

      - name: Build Setup.exe
        working-directory: src
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer\Build-Setup.ps1

      - name: Verify Setup.exe
        working-directory: src
        shell: powershell
        run: |
          $setup = 'installer\output\UG-DCMS-Setup-1.0.0-rc2.10.exe'
          if (-not (Test-Path $setup)) { throw "Missing $setup" }
          if ((Get-Item $setup).Length -lt 1000000) { throw 'Setup.exe is unexpectedly small' }
          Get-Item $setup | Format-List FullName,Length,LastWriteTime

      - name: Install UG-DCMS silently
        working-directory: src
        shell: powershell
        run: |
          $setup = (Resolve-Path 'installer\output\UG-DCMS-Setup-1.0.0-rc2.10.exe').Path
          $p = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/LOG=C:\ugdcms-inno.log') -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            Get-Content 'C:\ProgramData\UG-DCMS\logs\install.log' -Tail 250 -ErrorAction SilentlyContinue
            Get-Content 'C:\ProgramData\UG-DCMS\logs\LAST-ERROR.txt' -Tail 100 -ErrorAction SilentlyContinue
            Get-Content 'C:\ugdcms-inno.log' -Tail 250 -ErrorAction SilentlyContinue
            throw "Setup failed with exit code $($p.ExitCode)"
          }

      - name: Verify Windows services and deployment pointers
        shell: powershell
        run: |
          $db = Get-Service UGDCMS-PostgreSQL -ErrorAction Stop
          $app = Get-Service UGDCMS-App -ErrorAction Stop
          if ($db.Status -ne 'Running') { throw "UGDCMS-PostgreSQL is $($db.Status)" }
          if ($app.Status -ne 'Running') { throw "UGDCMS-App is $($app.Status)" }
          $runtime = (Get-Content 'C:\ProgramData\UG-DCMS\runtime\CURRENT-RUNTIME.txt' -Raw).Trim()
          $release = (Get-Content 'C:\ProgramData\UG-DCMS\releases\CURRENT-RELEASE.txt' -Raw).Trim()
          if (-not (Test-Path $runtime)) { throw "Runtime pointer target missing: $runtime" }
          if (-not (Test-Path $release)) { throw "Release pointer target missing: $release" }
          if (-not (Test-Path 'C:\ProgramData\UG-DCMS\INSTALLATION-STATUS.txt')) { throw 'INSTALLATION-STATUS.txt missing' }
          Get-Content 'C:\ProgramData\UG-DCMS\INSTALLATION-STATUS.txt'

      - name: HTTP health and UI smoke
        shell: powershell
        run: |
          $deadline = (Get-Date).AddSeconds(120)
          $health = $null
          do {
            try { $health = Invoke-RestMethod 'http://127.0.0.1:8080/api/v1/system/health' -TimeoutSec 5; break }
            catch { Start-Sleep -Seconds 2 }
          } while ((Get-Date) -lt $deadline)
          if (-not $health) {
            Get-Content 'C:\ProgramData\UG-DCMS\logs\install.log' -Tail 250 -ErrorAction SilentlyContinue
            throw 'Health endpoint did not become ready'
          }
          $ui = Invoke-WebRequest 'http://127.0.0.1:8080/' -UseBasicParsing -TimeoutSec 10
          if ($ui.StatusCode -ne 200) { throw "UI returned HTTP $($ui.StatusCode)" }
          Write-Host 'UG-DCMS Windows installer smoke PASS'

      - name: Upload Setup.exe and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ug-dcms-windows-installer-validation
          if-no-files-found: ignore
          path: |
            src/installer/output/*.exe
            C:/ProgramData/UG-DCMS/logs/*.log
            C:/ProgramData/UG-DCMS/logs/*.txt
            C:/ProgramData/UG-DCMS/INSTALLATION-STATUS.txt
            C:/ugdcms-inno.log
